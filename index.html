<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f40">
  <meta name="description" content="Cedille is a mobile-first French study app for DELF and DALF candidates: daily lessons, listening practice, timed exam sprints, and a visible readiness score.">
  <title>Cedille — French, daily.</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h4a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h6"/></symbol>
    <symbol id="i-exam" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-3-2-6-4-8 0 2-1 3-2 4 0-3-2-5-3-7-1 2-1 4 1 7-2 0-3-1-4-2-2 2-2 4-2 6 0 4 3 7 7 7Z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a3 3 0 0 0-3-3H4V4Z"/><path d="M20 4h-2a3 3 0 0 0-3 3v13a3 3 0 0 1 3-3h2V4Z"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 17v4M17 19h4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-ear" viewBox="0 0 24 24"><path d="M7 8a5 5 0 0 1 10 0c0 4-4 4-4 8a3 3 0 0 1-6 0"/><path d="M9 19a4 4 0 0 0 8 0"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <a class="brand" href="#today" aria-label="Cedille home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M29.5 12.5a12 12 0 1 0 0 15"/><path d="M20 29.5c0 4 2 6.5 5 6.5"/></svg>
        </span>
        <span class="brand-text"><strong>Cedille</strong><small>French, daily.</small></span>
      </a>

      <nav class="side-nav" aria-label="Main navigation">
        <a href="#today" data-nav="today"><span class="nav-icon"><svg class="icon"><use href="#i-home"></use></svg></span><span>Today</span></a>
        <a href="#path" data-nav="path"><span class="nav-icon"><svg class="icon"><use href="#i-route"></use></svg></span><span>Your path</span></a>
        <a href="#exam" data-nav="exam"><span class="nav-icon"><svg class="icon"><use href="#i-exam"></use></svg></span><span>Exam studio</span></a>
        <a href="#progress" data-nav="progress"><span class="nav-icon"><svg class="icon"><use href="#i-chart"></use></svg></span><span>Progress</span></a>
      </nav>

      <div class="side-plan">
        <div class="side-plan-top"><span>Your plan</span><strong data-bind="side-level">B1</strong></div>
        <p data-bind="side-target">DELF B1</p>
        <div class="mini-bar"><span data-bind="side-bar" style="width:68%"></span></div>
        <div class="side-plan-foot"><span>Readiness</span><strong><span data-bind="side-readiness">68</span>/100</strong></div>
      </div>

      <a class="side-profile" href="#profile" data-nav="profile" aria-label="Profile">
        <span class="avatar avatar-sm">LM</span>
        <span><strong>Léa Martin</strong><small>B1 candidate</small></span>
        <svg class="icon"><use href="#i-chevron"></use></svg>
      </a>
    </aside>

    <header class="mobile-bar">
      <a class="brand brand-mobile" href="#today" aria-label="Cedille home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M29.5 12.5a12 12 0 1 0 0 15"/><path d="M20 29.5c0 4 2 6.5 5 6.5"/></svg>
        </span>
        <span class="brand-text"><strong>Cedille</strong></span>
      </a>
      <div class="mobile-actions">
        <span class="streak-pill" title="Study streak"><svg class="icon"><use href="#i-flame"></use></svg><span data-bind="streak">6</span></span>
        <button class="avatar avatar-xs" data-action="go" data-view="profile" aria-label="Open profile">LM</button>
      </div>
    </header>

    <main id="view" class="view-root" tabindex="-1" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <a href="#today" data-nav="today"><svg class="icon"><use href="#i-home"></use></svg><span>Today</span></a>
      <a href="#path" data-nav="path"><svg class="icon"><use href="#i-route"></use></svg><span>Path</span></a>
      <a href="#exam" data-nav="exam"><svg class="icon"><use href="#i-exam"></use></svg><span>Exam</span></a>
      <a href="#progress" data-nav="progress"><svg class="icon"><use href="#i-chart"></use></svg><span>Progress</span></a>
      <a href="#profile" data-nav="profile"><svg class="icon"><use href="#i-user"></use></svg><span>Profile</span></a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">Cedille needs JavaScript for its lessons and practice questions. Please enable it and reload.</div>
  </noscript>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
